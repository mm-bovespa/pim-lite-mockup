    tailwind.config = {

        extend: {

  <style>
    .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .tree-item { transition: background 0.15s; }
    .panel-enter { animation: slideIn 0.25s ease-out; }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }

  </style>
</head>

      <!-- Breadcrumb -->
      <div id="breadcrumb" class="flex items-center text-sm text-slate-500 min-w-0 flex-1"></div>

      <!-- Search -->
      <div class="relative w-80">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="searchInput" type="text" placeholder="Search name or SKU…  (/)" class="w-full pl-9 pr-8 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none" />
        <button id="clearSearch" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 hidden">✕</button>
      </div>

      <!-- Language -->
      <div class="flex items-center gap-1 bg-slate-100 rounded-lg p-0.5 text-xs font-medium">
        <button id="langEN" class="px-2.5 py-1 rounded-md bg-white shadow-sm text-slate-800">EN</button>
        <button id="langDE" class="px-2.5 py-1 rounded-md text-slate-500 hover:text-slate-700">DE</button>
      </div>
    </header>

    <!-- Product List -->
    <div class="flex-1 overflow-auto scrollbar-thin p-6">
      <div id="productListContainer" class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 text-left">
            <tr>
              <th class="px-4 py-3 font-medium">Part Number</th>
              <th class="px-4 py-3 font-medium">Name</th>
              <th class="px-4 py-3 font-medium">Type</th>
              <th class="px-4 py-3 font-medium">Short Description</th>
              <th class="px-4 py-3 font-medium">Status</th>
            </tr>
          </thead>
          <tbody id="productTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
        <div id="emptyState" class="hidden py-20 text-center text-slate-400">
          <div class="text-4xl mb-3">📦</div>
          <div>No products match your filters</div>
        </div>
        <div id="loadingState" class="hidden p-4 space-y-3">
          <div class="skeleton h-10 rounded"></div>
          <div class="skeleton h-10 rounded"></div>
          <div class="skeleton h-10 rounded"></div>
        </div>
      </div>

      <!-- Pagination -->
      <div id="pagination" class="flex items-center justify-between mt-4 text-sm text-slate-500"></div>
    </div>
  </main>
</div>

    de: { name: "Crew Socken 3er-Pack", short: "Alltags-Crew-Socken", long: "Bequeme Baumwollmix-Crew-Socken." },
    attributes: { Color: "Mixed", Size: "M", Material: "Cotton Blend", Gender: "Unisex", Season: "All" },
    children: [] },
  { sku: "BOOT-HIKER-002", type: "Item", category: "boots", status: "Published",
    en: { name: "Trail Hiker – Size 42", short: "Size 42 hiker", long: "EU 42." },
    de: { name: "Trail Hiker – Größe 42", short: "Größe 42 Hiker", long: "EU 42." },
    attributes: { Color: "Brown", Size: "42", Material: "Leather + Gore-Tex", Gender: "Men", Season: "All" },
    children: [] }
];

// ==================== STATE ====================
let currentCatalog = "de";
let currentCategory = null; // null = all
let currentLang = "en";
let searchTerm = "";
let currentPage = 1;
const PAGE_SIZE = 12;
let selectedProduct = null;

// ==================== HELPERS ====================
function getCategoryName(id) {
  function find(cats) {
    for (const c of cats) {
      if (c.id === id) return c.name;
      if (c.children) {
        const found = find(c.children);
        if (found) return found;
      }
    }
    return null;
  }
  return find(CATALOGS[currentCatalog].categories) || id;
}

function countProductsInCategory(catId) {
  if (!catId) return PRODUCTS.length;
  // Include children
  const allIds = new Set();
  function collect(cats) {
    for (const c of cats) {
      allIds.add(c.id);
      if (c.children) collect(c.children);
    }
  }
  function findAndCollect(cats, target) {
    for (const c of cats) {
      if (c.id === target) {
        allIds.add(c.id);
        if (c.children) collect(c.children);
        return true;
      }
      if (c.children && findAndCollect(c.children, target)) return true;
    }
    return false;
  }
  findAndCollect(CATALOGS[currentCatalog].categories, catId);
  return PRODUCTS.filter(p => allIds.has(p.category)).length;
}

function getFilteredProducts() {
  let list = PRODUCTS;
  if (currentCategory) {
    const allIds = new Set();
    function collect(cats) {
      for (const c of cats) {
        allIds.add(c.id);
        if (c.children) collect(c.children);
      }
    }
    function findAndCollect(cats, target) {
      for (const c of cats) {
        if (c.id === target) {
          allIds.add(c.id);
          if (c.children) collect(c.children);
          return true;
        }
        if (c.children && findAndCollect(c.children, target)) return true;
      }
      return false;
    }
    findAndCollect(CATALOGS[currentCatalog].categories, currentCategory);
    list = list.filter(p => allIds.has(p.category));
  }
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    list = list.filter(p => 
      p.sku.toLowerCase().includes(q) ||
      p[currentLang].name.toLowerCase().includes(q)
    );
  }
  return list;
}

// ==================== RENDER ====================
function renderTree() {
  const tree = document.getElementById("categoryTree");
  tree.innerHTML = "";
  function renderNodes(nodes, depth = 0) {
    nodes.forEach(node => {
      const count = countProductsInCategory(node.id);
      const hasChildren = node.children && node.children.length;
      const isOpen = node._open !== false; // default open
      const div = document.createElement("div");
      div.className = "tree-item";
      div.innerHTML = `
        <div class="flex items-center gap-1 px-2 py-1.5 rounded-md hover:bg-slate-100 cursor-pointer ${currentCategory === node.id ? 'bg-brand-50 text-brand-700 font-medium' : ''}" data-id="${node.id}" style="padding-left: ${8 + depth * 16}px">
          ${hasChildren ? `<span class="toggle w-4 text-center text-slate-400">${isOpen ? '▾' : '▸'}</span>` : '<span class="w-4"></span>'}
          <span class="flex-1 truncate text-sm">${node.name}</span>
          <span class="text-xs bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">${count}</span>
        </div>
      `;
      const row = div.querySelector("[data-id]");
      row.onclick = (e) => {
        if (e.target.classList.contains("toggle")) {
          node._open = !isOpen;
          renderTree();
          return;
        }
        currentCategory = node.id;
        currentPage = 1;
        renderAll();
      };
      tree.appendChild(div);
      if (hasChildren && isOpen) {
        renderNodes(node.children, depth + 1);
      }
    });
  }
  // All products option
  const allDiv = document.createElement("div");
  allDiv.innerHTML = `
    <div class="flex items-center gap-1 px-2 py-1.5 rounded-md hover:bg-slate-100 cursor-pointer ${!currentCategory ? 'bg-brand-50 text-brand-700 font-medium' : ''}" data-id="all">
      <span class="w-4"></span>
      <span class="flex-1 text-sm">All Products</span>
      <span class="text-xs bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">${PRODUCTS.length}</span>
    </div>`;
  allDiv.querySelector("[data-id]").onclick = () => { currentCategory = null; currentPage = 1; renderAll(); };
  tree.appendChild(allDiv);
  renderNodes(CATALOGS[currentCatalog].categories);
}

function renderBreadcrumb() {
  const bc = document.getElementById("breadcrumb");
  const cat = CATALOGS[currentCatalog];
  let html = `<span class="font-medium text-slate-700">${cat.name}</span>`;
  if (currentCategory) {
    html += ` <span class="mx-1">/</span> <span>${getCategoryName(currentCategory)}</span>`;
  }
  bc.innerHTML = html;
}

function renderProducts() {
  const list = getFilteredProducts();
  const total = list.length;
  const pages = Math.ceil(total / PAGE_SIZE) || 1;
  if (currentPage > pages) currentPage = pages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = list.slice(start, start + PAGE_SIZE);

  const tbody = document.getElementById("productTableBody");
  const empty = document.getElementById("emptyState");
  const loading = document.getElementById("loadingState");
  loading.classList.add("hidden");

  if (pageItems.length === 0) {
    tbody.innerHTML = "";
    empty.classList.remove("hidden");
  } else {
    empty.classList.add("hidden");
    tbody.innerHTML = pageItems.map(p => `
      <tr class="hover:bg-slate-50 cursor-pointer transition-colors" data-sku="${p.sku}">
        <td class="px-4 py-3 font-mono text-xs text-slate-600">${p.sku}</td>
        <td class="px-4 py-3 font-medium">${p[currentLang].name}</td>
        <td class="px-4 py-3"><span class="text-xs px-2 py-0.5 rounded-full ${p.type === 'Product' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700'}">${p.type}</span></td>
        <td class="px-4 py-3 text-slate-500 truncate max-w-xs">${p[currentLang].short}</td>
        <td class="px-4 py-3"><span class="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">${p.status}</span></td>
      </tr>
    `).join("");
    tbody.querySelectorAll("tr").forEach(tr => {
      tr.onclick = () => openDetail(tr.dataset.sku);
    });
  }

  // Pagination
  const pag = document.getElementById("pagination");
  pag.innerHTML = `
    <div>Showing ${start + 1}–${Math.min(start + PAGE_SIZE, total)} of ${total}</div>
    <div class="flex gap-1">
      <button ${currentPage === 1 ? 'disabled' : ''} class="px-3 py-1 rounded border ${currentPage === 1 ? 'opacity-40' : 'hover:bg-slate-100'}" onclick="changePage(${currentPage - 1})">Previous</button>
      <button ${currentPage === pages ? 'disabled' : ''} class="px-3 py-1 rounded border ${currentPage === pages ? 'opacity-40' : 'hover:bg-slate-100'}" onclick="changePage(${currentPage + 1})">Next</button>
    </div>
  `;
}

function openDetail(sku) {
  const p = PRODUCTS.find(x => x.sku === sku);
  if (!p) return;
  selectedProduct = p;
  const content = document.getElementById("detailContent");
  const attrs = Object.entries(p.attributes).map(([k, v]) => `
    <div class="flex justify-between py-2 border-b border-slate-100 text-sm">
      <span class="text-slate-500">${k}</span>
      <span class="font-medium">${v}</span>
    </div>
  `).join("");
  const children = p.children.length ? p.children.map(c => `<span class="inline-block bg-slate-100 text-xs px-2 py-1 rounded mr-1 mb-1 font-mono">${c}</span>`).join("") : '<span class="text-slate-400 text-sm">No child SKUs</span>';

  content.innerHTML = `
    <div class="flex gap-6 mb-6">
      <div class="w-40 h-40 bg-slate-100 rounded-xl flex items-center justify-center text-4xl text-slate-300 flex-shrink-0">📦</div>
      <div class="min-w-0">
        <div class="text-xs font-mono text-slate-400 mb-1">${p.sku}</div>
        <h3 class="text-xl font-semibold mb-2">${p[currentLang].name}</h3>
        <p class="text-slate-600 mb-3">${p[currentLang].short}</p>
        <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">${p.status}</span>
        <span class="ml-2 text-xs px-2 py-0.5 rounded-full ${p.type === 'Product' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700'}">${p.type}</span>
      </div>
    </div>
    <div class="mb-6">
      <h4 class="font-medium mb-2">Long Description</h4>
      <p class="text-sm text-slate-600 leading-relaxed">${p[currentLang].long}</p>
    </div>
    <div class="mb-6">
      <h4 class="font-medium mb-3">Attributes</h4>
      <div class="bg-slate-50 rounded-lg px-4">${attrs}</div>
    </div>
    <div>
      <h4 class="font-medium mb-3">Related Items / SKUs</h4>
      <div>${children}</div>
    </div>
  `;
  document.getElementById("detailPanel").classList.remove("translate-x-full");
  document.getElementById("detailOverlay").classList.remove("hidden");
}

function closeDetail() {
  document.getElementById("detailPanel").classList.add("translate-x-full");
  document.getElementById("detailOverlay").classList.add("hidden");
}

function changePage(page) {
  currentPage = page;
  renderProducts();
}

function renderAll() {
  renderTree();
  renderBreadcrumb();
  renderProducts();
}

// ==================== EVENTS ====================
document.getElementById("catalogSelect").onchange = (e) => {
  currentCatalog = e.target.value;
  currentCategory = null;
  currentPage = 1;
  // Simulate loading
  document.getElementById("loadingState").classList.remove("hidden");
  document.getElementById("productTableBody").innerHTML = "";
  setTimeout(() => renderAll(), 300);
};

document.getElementById("searchInput").oninput = (e) => {
  searchTerm = e.target.value;
  document.getElementById("clearSearch").classList.toggle("hidden", !searchTerm);
  currentPage = 1;
  renderProducts();
};
document.getElementById("clearSearch").onclick = () => {
  document.getElementById("searchInput").value = "";
  searchTerm = "";
  document.getElementById("clearSearch").classList.add("hidden");
  currentPage = 1;
  renderProducts();
};

document.getElementById("langEN").onclick = () => {
  currentLang = "en";
  document.getElementById("langEN").className = "px-2.5 py-1 rounded-md bg-white shadow-sm text-slate-800";
  document.getElementById("langDE").className = "px-2.5 py-1 rounded-md text-slate-500 hover:text-slate-700";
  renderProducts();
  if (selectedProduct) openDetail(selectedProduct.sku);
};
document.getElementById("langDE").onclick = () => {
  currentLang = "de";
  document.getElementById("langDE").className = "px-2.5 py-1 rounded-md bg-white shadow-sm text-slate-800";
  document.getElementById("langEN").className = "px-2.5 py-1 rounded-md text-slate-500 hover:text-slate-700";
  renderProducts();
  if (selectedProduct) openDetail(selectedProduct.sku);
};

document.getElementById("closeDetail").onclick = closeDetail;
document.getElementById("detailOverlay").onclick = closeDetail;

// Keyboard shortcut
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
    e.preventDefault();
    document.getElementById("searchInput").focus();
  }
  if (e.key === "Escape") closeDetail();
});

// Init
renderAll();
</script>
</body>
</html>
